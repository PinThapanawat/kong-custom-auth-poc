services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-poc.json:/opt/keycloak/data/import/realm-poc.json
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kong:
    build:
      context: ./kong
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: "bundled,custom-auth"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_NGINX_HTTP_LUA_SHARED_DICT: "custom_auth_cache 10m"
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      PORT: "8080"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/poc"
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/poc/protocol/openid-connect/certs"
      KEYCLOAK_INTROSPECT_URL: "http://keycloak:8080/realms/poc/protocol/openid-connect/token/introspect"
      KEYCLOAK_CLIENT_ID: "poc-client"
      KEYCLOAK_INTROSPECTION_CLIENT_ID: "poc-introspection"
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: "introspection-secret"
    expose:
      - "8080"
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  client-simulator:
    build:
      context: ./client-simulator
    container_name: client-simulator
    environment:
      KEYCLOAK_TOKEN_URL: "http://keycloak:8080/realms/poc/protocol/openid-connect/token"
      AUTH_SERVICE_JWE_JWKS_URL: "http://auth-service:8080/.well-known/jwe-jwks.json"
      KONG_URL: "http://localhost:8000/api/accounts"
      KEYCLOAK_CLIENT_ID: "poc-client"
    depends_on:
      keycloak:
        condition: service_healthy
      auth-service:
        condition: service_started
    profiles: ["tools"]
