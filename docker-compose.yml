services:
  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    cap_add: ["IPC_LOCK"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root-poc-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    healthcheck:
      # "localhost" resolves to ::1 first in this image and Vault dev mode
      # doesn't bind the IPv6 loopback — use 127.0.0.1 explicitly.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: pds
      POSTGRES_USER: pds
      POSTGRES_PASSWORD: pds-poc-password
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pds"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/realm-poc.json:/opt/keycloak/data/import/realm-poc.json
    ports:
      - "8081:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          cat <&3 | grep -q '"status": "UP"'
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  kong:
    build:
      context: ./kong
    container_name: kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PLUGINS: "bundled,custom-auth"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    ports:
      - "8000:8000"
      - "8001:8001"
    depends_on:
      auth-service:
        condition: service_healthy
      account-service:
        condition: service_healthy
    restart: unless-stopped

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    environment:
      PORT: "8080"
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/poc"
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/poc/protocol/openid-connect/certs"
      KEYCLOAK_TOKEN_URL: "http://keycloak:8080/realms/poc/protocol/openid-connect/token"
      KEYCLOAK_CLIENT_ID: "poc-client"
      KEYCLOAK_INTROSPECT_URL: "http://keycloak:8080/realms/poc/protocol/openid-connect/token/introspect"
      KEYCLOAK_INTROSPECTION_CLIENT_ID: "poc-introspection"
      KEYCLOAK_INTROSPECTION_CLIENT_SECRET: "introspection-secret"
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root-poc-token"
      DATABASE_URL: "postgres://pds:pds-poc-password@postgres:5432/pds"
      REDIS_URL: "redis://redis:6379"
      PDS_ENV: "poc"
      PDS_SEK_SOURCE: "db"
      PDS_SEK_INQUIRY_URL: "http://auth-service:8080/pds/internal/sek-inquiry"
    expose:
      - "8080"
    depends_on:
      keycloak:
        condition: service_healthy
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  account-service:
    build:
      context: ./account-service
    container_name: account-service
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  client-simulator:
    build:
      context: ./client-simulator
    container_name: client-simulator
    environment:
      PDS_BASE_URL: "http://kong:8000"
    volumes:
      - client-simulator-data:/app/data
    depends_on:
      keycloak:
        condition: service_healthy
      kong:
        condition: service_started
    profiles: ["tools"]

volumes:
  client-simulator-data:
