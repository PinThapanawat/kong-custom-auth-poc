_format_version: "3.0"

# Category 1 (device enrollment, session acquiring) and the PDS JWKS
# endpoint are still a thin pass-through straight to auth-service — no
# crypto logic in Kong for those.
#
# Category 2/3 BFF traffic (/pds/bff/*) is different: the custom-auth
# plugin (kong/plugins/custom-auth/handler.lua) checks with the PDS that
# auth is complete, then Kong itself forwards the decrypted request to
# account-service and relays the (PDS-re-encrypted) response back. The
# `account-service` "service" below exists to satisfy Kong's schema (every
# route needs a parent service) but is never actually proxied to by Kong's
# own routing engine — the plugin's access phase always short-circuits
# with kong.response.exit() before Kong's core proxy phase would run.

services:
  - name: pds-service
    url: http://auth-service:8080

    routes:
      - name: pds-jwks
        paths:
          - /.well-known/pds-jwks.json
        methods:
          - GET
        strip_path: false

      - name: device-enrollment
        paths:
          - /pds/device/enrollment
        methods:
          - POST
        strip_path: false

      - name: session-acquiring
        paths:
          - /pds/session
        methods:
          - POST
        strip_path: false

    plugins:
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

  - name: account-service
    url: http://account-service:8080

    routes:
      - name: pds-bff
        paths:
          - /pds/bff
        methods:
          - GET
          - POST
          - PUT
          - DELETE
          - PATCH
        strip_path: false

    plugins:
      - name: correlation-id
        config:
          header_name: X-Correlation-ID
          generator: uuid
          echo_downstream: true

      - name: custom-auth
        config:
          pds_verify_url: http://auth-service:8080/pds/internal/verify
          pds_encrypt_response_url: http://auth-service:8080/pds/internal/encrypt-response
          account_service_url: http://account-service:8080
          timeout_ms: 5000
